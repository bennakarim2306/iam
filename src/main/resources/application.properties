spring.application.name=foodopia-backend
application.version="@project.version@"

# Stack Trace Logging
logging.include-stacktrace=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_USERNAME:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=create.sql
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-source=metadata

# Actuator Endpoints
management.endpoints.web.base-path=/management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

backend.notification.base-url=http://localhost:3000
# JWT Configuration
# For local development, use classpath
jwt.private-key=${JWT_PRIVATE_KEY:classpath:certs/foodopia_jwt_dev.privkey.pem}
jwt.public-key=${JWT_PUBLIC_KEY:classpath:certs/foodopia_jwt_dev.pubkey.pem}
# Access token expiration: 1 hour (3600000 ms)
jwt.token-expiration=${JWT_TOKEN_EXPIRATION:3600000}
# Refresh token expiration: 2 years (63072000000 ms = 2 * 365 * 24 * 60 * 60 * 1000)
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:63072000000}
# JWT Issuer
jwt.issuer=${JWT_ISSUER:foodopia-backend}
# JWT Audience
jwt.audience=${JWT_AUDIENCE:foodopia-api}

# Request Logging Configuration
app.logging.request.enabled=true
app.logging.request.log-headers=true
app.logging.request.log-body=true